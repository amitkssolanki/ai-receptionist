# Kamal deployment of the AI Restaurant Receptionist (docs/deploy/PRODUCTION.md is the runbook).
#
# Same server, registry, proxy and Postgres-accessory conventions as MCP Server, Platestead and Keepford: the shared
# server 91.98.193.40 (Kamal's default SSH user, root), images on ghcr.io/amitkssolanki, TLS from kamal-proxy with
# Let's Encrypt. This application has its own service name, hostname, Postgres container and databases; it shares no
# database with the other applications and publishes no Postgres port on the host.
#
# Secrets are listed by NAME only. .kamal/secrets reads their values from .env.kamal, which is git-ignored and never
# committed. There is no RAILS_MASTER_KEY: production reads nothing from config/credentials.yml.enc (its secret_key_base
# is the development one), so every production value comes from the environment below.
service: ai-receptionist
image: amitkssolanki/ai-receptionist

servers:
  web:
    hosts:
      - 91.98.193.40
    options:
      memory: 768m # Puma plus the Solid Queue supervisor; bounded so a fault cannot starve the other applications

proxy:
  ssl: true
  host: restaurant-receptionist.railsfanatics.com
  app_port: 80 # Thruster in front of Puma (Dockerfile)
  healthcheck:
    path: /up
    interval: 5
    timeout: 5

registry:
  server: ghcr.io
  username: amitkssolanki
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    RAILS_HOST: restaurant-receptionist.railsfanatics.com # config.hosts and URLs (config/environments/production.rb)
    RAILS_LOG_LEVEL: info
    DB_HOST: ai-receptionist-postgres # the accessory below, on Kamal's private Docker network
    SOLID_QUEUE_IN_PUMA: true # RAILS_MAX_THREADS stays unset: Puma 3 threads, pools of 5 (Solid Queue needs threads + 2)
  secret:
    - SECRET_KEY_BASE # new for production (bin/rails secret); never the development one
    - AI_RECEPTIONIST_DATABASE_PASSWORD # = POSTGRES_PASSWORD, set in .kamal/secrets
    - VAPI_SERVER_SECRET # new for production, 16+ characters; the production assistant sends it as X-Vapi-Secret
    - VAPI_PUBLIC_KEY # the production browser key, restricted in Vapi to this origin and the production assistant
    - VAPI_ASSISTANT_ID # the production assistant (never the development, baseline or fault-injection assistant)
    - ADMIN_EMAIL # one-time admin bootstrap of an empty database (db/seeds.rb)
    - ADMIN_PASSWORD # one-time; emptied in .env.kamal after the first deploy (runbook step 16)

# Not configured on purpose: TWILIO_* (browser calls have no phone number, so no confirmation SMS is sent; the job is a
# no-op without them), VAPI_PRIVATE_KEY (only the local, read-only vapi:check uses it) and
# VAPI_FAULT_INJECTION_ASSISTANT_ID (development-only; VapiConfig ignores it in production).

logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

asset_path: /rails/public/assets

accessories:
  postgres:
    image: postgres:18
    host: 91.98.193.40
    cmd: postgres -c shared_buffers=64MB -c max_connections=60 # 4 databases x Puma and Solid Queue pools of 5, with margin
    options:
      memory: 256m
    env:
      clear:
        POSTGRES_USER: ai_receptionist
        POSTGRES_DB: ai_receptionist_production # db:prepare creates the _cache, _queue and _cable databases next to it
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: accessory exec postgres --interactive --reuse "psql -U ai_receptionist ai_receptionist_production"
